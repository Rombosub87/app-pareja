{% extends "base.html" %}
{% block title %}Entrar — Nosotros{% endblock %}

{% block content %}
<main class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-icon">💙</div>
            <h1>Nosotros</h1>
            <p class="login-subtitle">Solo vosotros dos</p>
        </div>

        <form id="loginForm" action="/login" method="POST" autocomplete="off">
            <!-- Selector de usuario -->
            <div class="user-selector">
                <button type="button" class="user-btn active" data-user="Sofía" onclick="selectUser(this)">Sofía</button>
                <button type="button" class="user-btn" data-user="Daniel" onclick="selectUser(this)">Daniel</button>
            </div>

            <input type="hidden" name="username" id="usernameInput" value="Sofía">

            <!-- Display del PIN -->
            <div class="pin-display" aria-label="PIN introducido">
                <div class="pin-dot" id="dot0"></div>
                <div class="pin-dot" id="dot1"></div>
                <div class="pin-dot" id="dot2"></div>
                <div class="pin-dot" id="dot3"></div>
            </div>
            <input type="hidden" name="pin" id="pinInput" value="">

            <!-- Teclado numérico -->
            <div class="pin-keyboard">
                {% for n in [1,2,3,4,5,6,7,8,9] %}
                <button type="button" class="key-btn" onclick="pressKey('{{ n }}')">{{ n }}</button>
                {% endfor %}
                <div></div>
                <button type="button" class="key-btn" onclick="pressKey('0')">0</button>
                <button type="button" class="key-btn key-del" onclick="deleteKey()">⌫</button>
            </div>
        </form>
    </div>
</main>

<script>
let currentPin = "";

function selectUser(btn) {
    document.querySelectorAll(".user-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("usernameInput").value = btn.dataset.user;
    clearPin();
}

function pressKey(digit) {
    if (currentPin.length >= 4) return;
    currentPin += digit;
    updateDots();
    if (currentPin.length === 4) {
        document.getElementById("pinInput").value = currentPin;
        setTimeout(() => document.getElementById("loginForm").submit(), 150);
    }
}

function deleteKey() {
    currentPin = currentPin.slice(0, -1);
    updateDots();
}

function clearPin() {
    currentPin = "";
    updateDots();
}

function updateDots() {
    for (let i = 0; i < 4; i++) {
        document.getElementById("dot" + i).classList.toggle("filled", i < currentPin.length);
    }
}
</script>
{% endblock %}
